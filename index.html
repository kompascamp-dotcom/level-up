<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Level UP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 20px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin: 8px 0 30px;
    }

    .card {
      background: #1f2937;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 18px;
    }

    .label {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .level {
      font-size: 30px;
      font-weight: bold;
    }

    .xp {
      margin-top: 6px;
      color: #9ca3af;
    }

    .progress {
      height: 10px;
      background: #374151;
      border-radius: 10px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.4s;
    }

    .week {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .task-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .task {
      color: #d1d5db;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 17px;
      margin-top: 22px;
      background: #22c55e;
      color: #052e16;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: default;
    }

    .success {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: #14532d;
      color: #bbf7d0;
      text-align: center;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">LEVEL UP</div>

  <div class="subtitle">
    Стань лучше. Шаг за шагом.
  </div>

  <div class="card">

    <div class="label">ТВОЙ УРОВЕНЬ</div>

    <div class="level">
      Уровень <span id="level">1</span>
    </div>

    <div class="xp">
      <span id="xp">0</span> / 100 XP
    </div>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>

  </div>

  <div class="card">

    <div class="week">
      ЗАДАНИЕ НЕДЕЛИ
    </div>

    <div class="task-title">
      Первый шаг
    </div>

    <div class="task">
      Сделай сегодня что-нибудь, что ты давно откладывал.
      Маленький шаг тоже считается.
    </div>

    <button id="completeButton" onclick="completeTask()">
      Я выполнил
    </button>

    <div class="success" id="success">
      🎉 Задание выполнено!<br>
      +100 XP
    </div>

  </div>

  <div class="footer">
    Level UP • Развивайся каждую неделю
  </div>

</div>

<script>

let xp = Number(localStorage.getItem("xp")) || 0;
let level = Number(localStorage.getItem("level")) || 1;
let completed = localStorage.getItem("completed") === "true";

function completeTask() {

  if (completed) {
    return;
  }

  completed = true;

  xp += 100;

  localStorage.setItem("xp", xp);
localStorage.setItem("level", level);
localStorage.setItem("completed", "true");

  if (xp >= 100) {
    level++;
    xp = 0;
  }

  document.getElementById("level").textContent = level;
  document.getElementById("xp").textContent = xp;
  document.getElementById("progress").style.width = xp + "%";

  document.getElementById("completeButton").textContent =
    "Задание выполнено ✓";

  document.getElementById("completeButton").disabled = true;

  document.getElementById("success").style.display = "block";
}

if (completed) {
  document.getElementById("completeButton").textContent =
    "Задание выполнено ✓";

  document.getElementById("completeButton").disabled = true;

  document.getElementById("success").style.display = "block";
}

document.getElementById("level").textContent = level;
document.getElementById("xp").textContent = xp;
document.getElementById("progress").style.width = xp + "%";
  
</script>

</body>
</html>
